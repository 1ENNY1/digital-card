databases:
  - name: digital-card-db
    plan: free
    databaseName: digital_card
    user: digital_card

services:
  - type: web
    name: digital-card
    runtime: docker
    plan: free
    healthCheckPath: /graphql?query=%7B__typename%7D
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-card-db
          property: connectionString
